[project]
name = "beeboard2"
version = "0.1.0"
description = "BeeBoard 2 Backend"
authors = [
    {name = "Jean Schmitz"}
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.0,<2.1.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "litellm>=1.30.0",
    "pillow>=11.0.0",
    "httpx>=0.28.0",
    "email-validator>=2.0.0",
    "apscheduler>=3.10.4",
    "alembic>=1.13.0",
    "fastmcp>=3.0.0",
    "reportlab>=4.0.0",
]

[tool.poetry]
packages = [{include = "app"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
ruff = ">=0.8.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "E9",
  "F63",
  "F7",
  "F82",
]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
